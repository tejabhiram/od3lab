<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News | OD3 Lab, UIC</title>
<meta name="description" content="News from the OD3 Lab at the University of Illinois Chicago.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/favicon.svg">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
<div class="page-head">
  <div class="wrap">
    <span class="eyebrow">News</span>
    <h1>What's happening in the lab</h1>
  </div>
</div>
<section style="padding-top:24px">
  <div class="wrap" style="display:grid;grid-template-columns:1fr 340px;gap:56px;align-items:start" id="news-grid">
    <ul class="news-list" id="news"></ul>
    <aside style="position:sticky;top:100px">
      <figure style="margin:0"><img src="img/crs2025.jpg" alt="Teja speaking at the CRS 2025 Annual Meeting" style="border-radius:14px"><figcaption class="muted" style="font-size:.82rem;margin-top:8px">Teja at the CRS 2025 Annual Meeting</figcaption></figure>
    </aside>
  </div>
</section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/site.js"></script>
<script src="data/content.js"></script>
<script>
  document.getElementById("news").innerHTML=OD3.news.map(OD3.newsItem).join("");
  if(window.innerWidth<900){var g=document.getElementById("news-grid");g.style.gridTemplateColumns="1fr";g.querySelector("aside").style.position="static";}
</script>
</body>
</html>
